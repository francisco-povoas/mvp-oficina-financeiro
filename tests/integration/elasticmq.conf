include classpath("application.conf")

node-address {
  protocol = http
  host = "0.0.0.0"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  "mvp-oficina-financeiro-to-ordens-local.fifo" {
    fifo = true
    content-based-deduplication = false
  }
}
