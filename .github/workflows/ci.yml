name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      PYTHONPATH: src
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      DYNAMODB_ENDPOINT_URL: http://127.0.0.1:8000
      DYNAMODB_TABLE: mvp-oficina-financeiro-ci
      JWT_SECRET_KEY: chave-ficticia-exclusiva-para-ci
      JWT_ALGORITHM: HS256
      SQS_ENDPOINT_URL: http://127.0.0.1:9324
      SQS_FINANCEIRO_TO_ORDENS_URL: http://127.0.0.1:9324/000000000000/mvp-oficina-financeiro-to-ordens-local.fifo
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.6.1
        ports:
          - 8000:8000
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Wait for and bootstrap DynamoDB Local
        run: python -m app.infrastructure.bootstrap
      - name: Lint
        run: python -m ruff check src tests
      - name: Unit tests
        run: python -m pytest tests/unit
      - name: Contract tests
        run: python -m pytest tests/contracts
      - name: DynamoDB and ElasticMQ integration tests
        run: python -m pytest tests/integration
      - name: Full suite and coverage gate
        run: python -m pytest --cov=src/app --cov-report=term-missing
      - name: Build runtime image
        run: docker build --target runtime -t mvp-oficina-financeiro:${{ github.sha }} .
